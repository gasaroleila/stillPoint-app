name: stillpoint
options:
  bundleIdPrefix: com.stillpoint
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.4"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.16.0"

settings:
  base:
    SWIFT_VERSION: "6.1"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  stillpoint:
    type: application
    platform: iOS
    sources:
      - path: stillpoint
        excludes:
          - "Preview Content"
    resources:
      - path: stillpoint/Resources
        excludes:
          - "Info.plist"
      - path: stillpoint/Preview Content
    settings:
      base:
        INFOPLIST_FILE: stillpoint/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpoint.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions

  stillpointTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: stillpointTests
    dependencies:
      - target: stillpoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpoint.app.tests
